
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Simpel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 10px #0001;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Halo, Dunia! 👋</h1>
        <p>Ini adalah website HTML simpel pertama saya.</p>
        <button onclick="alert('Halo! Selamat datang!')">
            Klik Saya
        </button>
    </div>

</body>
</html>
